<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kejutan untuk Mba Iren! 🎉</title>
    <link rel="stylesheet" href="style.css">
    <!-- Library untuk efek Confetti -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
</head>
<body>
    <!-- Pastikan nama file musik sesuai dengan yang ada di folder assets -->
    <audio id="bg-music" src="assets/music.mp3" loop></audio>

    <!-- Halaman Pembuka -->
    <div id="opening-screen" class="screen active">
        <h1>Ada kejutan buat kamu! 💌</h1>
        <button id="open-btn">Buka Kejutan 🎁</button>
    </div>

    <!-- Halaman Utama (Muncul setelah tombol diklik) -->
    <div id="main-screen" class="screen">
        <div class="gallery">
            <img id="photo" src="assets/foto1.jpg" alt="Foto Kenangan">
        </div>
        <div class="message-container">
            <p id="typing-text"></p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
