<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kejutan untuk Mba Iren! 🎉</title>
    <link rel="stylesheet" href="style.css">
    
    <!-- Library Eksternal -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>
    <audio id="bg-music" src="assets/music.mp3" loop></audio>

    <!-- Halaman Pembuka -->
    <div id="opening-screen" class="screen active">
        <h1>Ada kejutan buat kamu! 💌</h1>
        <button id="open-btn">Buka Kejutan 🎁</button>
    </div>

    <!-- Halaman Utama -->
    <div id="main-screen" class="screen">
        <!-- Wadah untuk foto-foto yang berserakan di belakang -->
        <div id="photo-container"></div>

        <!-- Pesan Teks -->
        <div class="message-container">
            <p id="typing-text"></p>
        </div>
        
        <!-- Tombol Surat Khusus (Di Tengah Bawah) -->
        <div class="action-buttons">
            <button id="letter-btn" style="display: none;">Baca Surat Khusus 💌</button>
        </div>
        
        <!-- Tombol Tambah Foto (Dipindah Melayang ke Kiri Bawah, Kecil) -->
        <button id="add-photo-btn" style="display: none;" title="Tambah Foto">➕ 📸</button>
        
        <!-- Input File (Multiple untuk banyak foto sekaligus) -->
        <input type="file" id="file-input" accept="image/*" multiple style="display: none;">
    </div>

    <script src="script.js"></script>
</body>
</html>
